# grading-code verifies the bearer token with Auth.getUser and session-aware RPCs.
# This supports current Supabase signing keys without relying on the legacy gateway verifier.
[functions.grading-code]
verify_jwt = false

# delete-account verifies the bearer token with Auth.getUser. Destructive
# execution also requires ACCOUNT_DELETION_EXECUTION_ENABLED=true and the
# database policy gate to report ready_for_auth_deletion=true.
[functions.delete-account]
verify_jwt = false

# ai-tutor verifies the bearer token with Auth.getUser and enforces an
# authenticated, session-aware student quota in the database.
[functions.ai-tutor]
verify_jwt = false
